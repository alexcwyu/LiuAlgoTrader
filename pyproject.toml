[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liualgotrader"
version = "0.4.35"
description = "a Pythonic all-batteries-included framework for effective algorithmic trading. The framework is intended to simplify development, testing, deployment and evaluating algo trading strategies."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
  {name = "AMOR71", email = "amor71@sgeltd.com"},
]
keywords = ["trading", "algorithmic-trading", "stocks", "crypto", "backtesting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "iso8601>=2.1.0",
  "requests>=2.32.5",
  "deprecated>=1.2.15",
  # "urllib3>=2.3.0",  # Temporarily removed: conflicts with alpaca-trade-api (<2); pulled transitively via requests
  "numpy>=2.3.4",
  "pandas>=2.3.3",
  "asyncpg>=0.30.0",
  "pygit2>=1.16.0",
  "matplotlib>=3.10.7",
  "tabulate>=0.9.0",
  "streamlit>=1.51.0",
  "stockstats>=0.6.2",
  "nest-asyncio>=1.6.0",
  "parsedatetime>=2.6",
  "scipy>=1.16.3",
  "polygon-api-client>=1.15.1",
  "finnhub-python>=2.4.20",
  "tqdm>=4.67.1",
  "toml>=0.10.2",
  "fire>=0.7.1",
  "pandas-market-calendars>=4.4.1",
  "psutil>=6.1.1",
  "aiohttp>=3.13.2",
]
[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.25.2",
    "hypothesis>=6.125.6",
    "mypy>=1.15.0",
    "black>=24.12.0",
    "isort>=5.13.2",
    "sphinx>=8.1.3",
    "coverage>=7.6.10",
]

[tool.uv]
default-groups = ["dev"]

[project.optional-dependencies]
alpaca = [
    "alpaca-trade-api>=3.2.0",
]
analytics = [
    # "empyrical>=0.5.5",  # Temporarily disabled: not compatible with Python 3.13
    "empyrical-reloaded>=0.5.5",  # Drop-in replacement for empyrical that supports Python 3.13
    "quantstats>=0.0.77",
]

[project.urls]
Homepage = "https://github.com/amor71/LiuAlgoTrader"
Documentation = "https://liualgotrader.readthedocs.io"
Repository = "https://github.com/amor71/LiuAlgoTrader"
"Bug Tracker" = "https://github.com/amor71/LiuAlgoTrader/issues"

[project.scripts]
backtester = "liualgotrader.scripts.backtester:main_cli"
liu = "liualgotrader.scripts.liu:main_cli"
market_miner = "liualgotrader.scripts.market_miner:main_cli"
optimizer = "liualgotrader.scripts.optimizer:main_cli"
portfolio = "liualgotrader.scripts.portfolio:main_cli"
trader = "liualgotrader.scripts.trader:main_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/liualgotrader"]

[tool.hatch.build.targets.sdist]
include = [
    "src/liualgotrader/**",
    "README.md",
    "LICENSE",
    "database/**",
    "static/**",
]
exclude = [
    "tests/**",
    "docs/**",
    "examples/**",
    "design/**",
]


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["liualgotrader"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
log_cli = true
norecursedirs = ["tests/legacy"]
markers = [
    "devtest: marks a test to run during dev validation, and not deployment (deselect with '-m \"not devtest\"')",
    "serial",
]
